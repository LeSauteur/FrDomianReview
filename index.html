<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ревизия — Домиан Франчайзинг</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <main>
        <header class="toolbar">
            <div class="toolbar-top">
                <div><h1>Ревизия файлов</h1><p class="toolbar-subtitle">Домиан Франчайзинг</p></div>
                <div class="sync-summary">
                    <span id="sync-state" class="sync-state" data-state="dirty">Загрузка…</span>
                    <span id="last-sync">Последняя синхронизация: ещё не выполнялась</span>
                    <button id="save-now" type="button">Сохранить сейчас</button>
                </div>
            </div>
            <div class="summary">
                <span class="metric">Всего <strong id="count-total">0</strong></span>
                <span class="metric">Проверено <strong id="count-reviewed">0</strong></span>
                <span class="metric">Осталось <strong id="count-unreviewed">0</strong></span>
                <strong class="metric metric-progress" id="progress">0 / 0 — 0,0%</strong>
            </div>
            <div class="status-chips">
                <span class="status-chip" data-status="KEEP">Оставить <strong id="count-KEEP">0</strong></span>
                <span class="status-chip" data-status="ARCHIVE">Архив <strong id="count-ARCHIVE">0</strong></span>
                <span class="status-chip" data-status="UPDATE">Обновить <strong id="count-UPDATE">0</strong></span>
                <span class="status-chip" data-status="DUPLICATE">Дубликат <strong id="count-DUPLICATE">0</strong></span>
                <span class="status-chip" data-status="DELETE">Удалить <strong id="count-DELETE">0</strong></span>
                <span class="status-chip" data-status="UNSURE">Не уверен <strong id="count-UNSURE">0</strong></span>
                <span class="status-chip" data-status="CONFLICT">Конфликт <strong id="count-CONFLICT">0</strong></span>
                <span class="status-chip" data-status="TODO">К выполнению <strong id="count-TODO">0</strong></span>
                <span class="status-chip" data-status="DONE">Выполнено <strong id="count-DONE">0</strong></span>
            </div>
            <div class="filter-tools">
                <label class="search-label">Поиск <input id="file-search" type="search" placeholder="Поиск по файлам…" autocomplete="off"></label>
            <div class="filters" aria-label="Фильтры">
                <button type="button" data-filter="ALL" class="active-filter">Все</button>
                <button type="button" data-filter="UNREVIEWED">Только непроверенные</button>
                <button type="button" data-filter="KEEP">Оставить</button>
                <button type="button" data-filter="ARCHIVE">Архив</button>
                <button type="button" data-filter="UPDATE">Обновить</button>
                <button type="button" data-filter="DUPLICATE">Дубликат</button>
                <button type="button" data-filter="DELETE">Удалить</button>
                <button type="button" data-filter="UNSURE">Не уверен</button>
                <button type="button" data-filter="CONFLICT">Конфликты</button>
                <button type="button" data-filter="TODO">К выполнению</button>
                <button type="button" data-filter="DONE">Выполнено</button>
                <button type="button" data-filter="COMMENTS">Есть комментарии</button>
            </div>
            </div>
            <div class="view-tools">
                <label>Тип <select id="type-filter"><option value="ALL">Все типы</option></select></label>
                <label>Размер <select id="size-filter">
                    <option value="0">Любой</option>
                    <option value="10485760">больше 10 МБ</option>
                    <option value="104857600">больше 100 МБ</option>
                    <option value="524288000">больше 500 МБ</option>
                    <option value="1073741824">больше 1 ГБ</option>
                </select></label>
                <label>Вид <select id="view-mode">
                    <option value="tree">По папкам</option>
                    <option value="size">Список по размеру ↓</option>
                </select></label>
                <span class="metric" id="shown-summary"></span>
            </div>
            <div class="actions">
                <button id="expand-all" type="button">Развернуть всё</button>
                <button id="collapse-all" type="button">Свернуть всё</button>
                <span class="action-divider"></span>
                <button id="export-results" type="button">Экспорт JSON</button>
                <label>Импорт JSON <input id="import-results" type="file" accept="application/json,.json"></label>
                <label class="reviewer-label">Проверяющий <select id="reviewer">
                    <option value="">Выберите сотрудника</option>
                </select></label>
                <details class="token-settings"><summary>GitHub token</summary>
                    <div class="token-fields"><input id="github-token" type="password" autocomplete="off" spellcheck="false" aria-label="GitHub token"><button id="clear-token" type="button">Очистить token</button></div>
                </details>
                <span id="message" role="status"></span>
            </div>
        </header>
        <ul id="catalog" class="tree"></ul>
    </main>
    <script src="review-core.js?v=4" defer></script>
    <script src="review.js?v=4" defer></script>
</body>
</html>
