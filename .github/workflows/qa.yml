name: QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check review-core.js
          node --check review.js
          node --check scripts/scan-disk.mjs
          node --check scripts/migrate-decisions.mjs
          node --check scripts/build-delete-plan.mjs
          node --check scripts/quarantine.mjs
          node --check scripts/helper.mjs

      - name: Tests (manifest, migration, merge rules)
        run: node --test
