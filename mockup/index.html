    const search = document.querySelector('#search');
    const content = document.querySelector('#content');
    const navigation = document.querySelector('#navigation');
    const select = document.querySelector('#section-select');
    const clearButton = document.querySelector('#clear-search');
    const announcement = document.querySelector('#announcement');
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const normal = value => String(value).toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
    const dateLabel = value => value.split('-').reverse().join('.');
    const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14) ? few : many;
    const documentCount = item => item.items ? item.items.reduce((sum, entry) => sum + documentCount(entry), 0) : 1;
    const groupCount = group => group.groups ? group.groups.reduce((sum, entry) => sum + groupCount(entry), 0) : group.files.reduce((sum, entry) => sum + documentCount(entry), 0);
    const sectionCount = section => section.groups.reduce((sum, group) => sum + groupCount(group), 0);
    const countLabel = n => `${n} ${plural(n,'документ','документа','документов')}`;
    const arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>';
    const chevron = '<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
    let current = catalog.some(s => `#section-${s.id}` === location.hash) ? location.hash.slice(9) : '00';

    function formatIcon(file) {
      const fmt = file.formats[0];
      const type = fmt === 'MP4' ? 'video' : /^XLS/.test(fmt) ? 'sheet' : fmt === 'PDF' ? 'pdf' : '';
      return `<span class="file-icon ${type}" aria-hidden="true">${fmt === 'MP4' ? '<svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"/></svg>' : escapeHTML(fmt)}</span>`;
    }
    function actions(file) {
      const labels = file.formats.includes('MP4') ? ['Смотреть'] : ['Открыть','Скачать'];
      return `<div class="actions">${labels.map((label,i) => `<span class="action-wrap" tabindex="0" data-tooltip="Макет: файл не подключён" title="Макет: файл не подключён" aria-label="${label}: ${escapeHTML(file.title)}. Макет: файл не подключён"><button disabled class="file-action ${i ? 'secondary' : ''}" tabindex="-1">${i ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg>' : ''}${label}</button></span>`).join('')}</div>`;
    }
    function fileInfo(file, context = '') {
      return `<div class="file-info">${context ? `<p class="result-context">${escapeHTML(context)}</p>` : ''}<div class="file-name">${escapeHTML(file.title)}${file.update ? '<span class="update">На обновлении</span>' : ''}</div><div class="file-meta"><span class="formats">${file.formats.map(fmt => `<span class="format-badge">${escapeHTML(fmt)}</span>`).join('')}</span><span>${escapeHTML(file.size)}</span><time class="file-date" datetime="${escapeHTML(file.date)}">${dateLabel(file.date)}</time></div></div>`;
    }
    function renderFile(file, context = '') {
      if (file.items) {
        const nouns = file.itemType === 'макет' ? ['макет','макета','макетов'] : file.itemType === 'видео' ? ['видео','видео','видео'] : ['материал','материала','материалов'];
        return `<details class="set"><summary class="file-row">${formatIcon(file)}<div>${fileInfo(file, context)}<span class="set-label">Набор · ${documentCount(file)} ${plural(documentCount(file),...nouns)}</span></div>${chevron}</summary><div class="set-items file-list" role="list">${file.items.map(entry => renderFile(entry)).join('')}</div></details>`;
      }
      return `<div class="file-row" role="listitem">${formatIcon(file)}${fileInfo(file, context)}${actions(file)}</div>`;
    }
    function renderGroup(group) {
      const heading = `<div><h2>${escapeHTML(group.title)}</h2>${group.owner ? `<p class="group-note">Ответственный: ${escapeHTML(group.owner)}</p>` : ''}${group.note ? `<p class="group-note">${escapeHTML(group.note)}</p>` : ''}</div><span class="card-count">${countLabel(groupCount(group))}</span>`;
      const body = group.groups ? group.groups.map(sub => `<div class="subgroup-title">${escapeHTML(sub.title)}</div><div class="file-list" role="list">${sub.files.map(file => renderFile(file)).join('')}</div>`).join('') : `<div class="file-list" role="list">${group.files.map(file => renderFile(file)).join('')}</div>`;
      return group.collapsed ? `<details class="card"><summary class="card-heading"><div class="disclosure">${chevron}${heading}</div></summary>${body}</details>` : `<section class="card"><div class="card-heading">${heading}</div>${body}</section>`;
    }
    function footer() {
      return '<footer class="footer"><span>Домиан Франчайзинг · Каталог материалов</span><span>Визуальный макет · октябрь 2026</span></footer>';
    }
    function renderNav() {
      navigation.innerHTML = catalog.map(section => `<a class="nav-link ${section.archive ? 'archive-link' : ''}" href="#section-${section.id}" ${section.id === current && !search.value.trim() ? 'aria-current="page"' : ''}><span class="nav-number">${section.id}</span><span>${escapeHTML(section.title)}${section.archive ? '<span style="display:block;font-size:9px;margin-top:2px">Не публикуется</span>' : ''}</span><span class="nav-count" aria-label="${countLabel(sectionCount(section))}">${sectionCount(section)}</span></a>`).join('');
      select.innerHTML = catalog.map(section => `<option value="${section.id}">${section.id} · ${escapeHTML(section.title)} — ${sectionCount(section)}${section.archive ? ' · Не публикуется' : ''}</option>`).join('');
      select.value = current;
    }
    function renderSection() {
      const section = catalog.find(s => s.id === current);
      content.className = section.archive ? 'archive' : '';
      content.innerHTML = `<div class="breadcrumb"><a href="#section-00">Материалы</a>${chevron}<span>${escapeHTML(section.title)}</span></div><div class="section-top"><div><p class="eyebrow section-kicker">Раздел ${section.id} / ${section.archive ? 'Внутренний архив' : 'Для руководителя'}</p><h1>${escapeHTML(section.title)}</h1><p class="description">${escapeHTML(section.description)}</p></div><span class="section-stamp" aria-hidden="true">${section.id}</span></div><div class="meta"><span>Ответственный<strong class="${section.owner === 'Не назначен' ? 'unassigned' : ''}">${escapeHTML(section.owner)}</strong></span><span>Актуально на<strong><time datetime="${section.date}">${dateLabel(section.date)}</time></strong></span><span>${countLabel(sectionCount(section))}</span></div>${section.id === '00' ? '<div class="welcome"><div><h2>Нужные материалы — под рукой</h2><p>От открытия офиса до ежедневной работы команды. Начните с инструкции, а затем выберите раздел под вашу задачу.</p></div><span class="welcome-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3zM12 6v16"/></svg></span></div>' : ''}${section.archive ? '<p class="archive-warning">Не публикуется · Закрытый раздел показан только для обсуждения структуры будущего каталога.</p><details class="card"><summary class="card-heading"><div class="disclosure">'+chevron+'<h2>Архивные материалы</h2></div><span class="card-count">5 наборов</span></summary>'+section.groups.map(g => `<div class="file-list" role="list">${g.files.map(f => renderFile(f)).join('')}</div>`).join('')+'</details>' : section.groups.map(renderGroup).join('')}${section.id === '00' ? `<div class="next-grid"><a class="next-link" href="#section-01"><p class="eyebrow">Следующий шаг</p><strong>Планируете открытие офиса? ${arrow}</strong><p>Регистрация, помещение и запуск</p></a><a class="next-link" href="#section-02"><p class="eyebrow">Обратите внимание</p><strong>Стандарты на обновлении ${arrow}</strong><p>Приложения к бизнес-системе франшизы</p></a></div>` : ''}${footer()}`;
      document.title = `${section.title} — Домиан Франчайзинг`;
    }
    function searchableFiles(section) {
      const rows = [];
      function visit(group, path = '') {
        const context = path ? `${path} / ${group.title}` : group.title;
        if (group.groups) group.groups.forEach(sub => visit(sub, context));
        else group.files.forEach(file => {
          rows.push({ file, context });
          if (file.items) file.items.forEach(item => rows.push({ file:item, context:`${context} / ${file.title}` }));
        });
      }
      section.groups.forEach(group => visit(group));
      return rows;
    }
    const searchIndex = catalog.map(section => ({section, rows:searchableFiles(section)}));
    function renderSearch() {
      const query = normal(search.value);
      clearButton.hidden = !search.value;
      renderNav();
      if (!query) { renderSection(); announcement.textContent = ''; return; }
      const terms = query.split(' ');
      const results = searchIndex.map(({section,rows}) => ({section, rows: rows.filter(({file,context}) => terms.every(term => normal(`${file.title} ${file.formats.join(' ')} ${context} ${section.id} ${section.title}`).includes(term)))})).filter(result => result.rows.length);
      const total = results.reduce((sum, result) => sum + result.rows.length, 0);
      content.className = '';
      content.innerHTML = `<div class="breadcrumb"><a href="#section-${current}" data-clear>Материалы</a>${chevron}<span>Поиск по каталогу</span></div><p class="eyebrow section-kicker">Во всех разделах</p><h1>Результаты поиска</h1><p class="search-status">${total ? `Найдено: ${total} ${plural(total,'материал','материала','материалов')}` : 'Совпадений нет'} по запросу «${escapeHTML(search.value.trim())}»</p>${total ? results.map(({section,rows}) => `<section class="result-section ${section.archive ? 'archive' : ''}"><div class="result-heading"><a href="#section-${section.id}"><span class="nav-number">${section.id}</span>${escapeHTML(section.title)} ${arrow}</a><span class="card-count">${section.archive ? 'Не публикуется · ' : ''}${rows.length}</span></div><div class="card file-list" role="list">${rows.map(({file,context}) => renderFile(file,context)).join('')}</div></section>`).join('') : '<div class="empty"><h2>Попробуйте другой запрос</h2><p>Например: «Авито», «договор» или «визитка».<br>Можно искать по названию, разделу и формату.</p><button class="reset" data-clear>Сбросить поиск</button></div>'}${footer()}`;
      announcement.textContent = `Найдено материалов: ${total}. Разделов: ${results.length}.`;
      document.title = 'Поиск материалов — Домиан Франчайзинг';
    }
    function clearSearch() { search.value = ''; renderSearch(); }
    function navigate(id) {
      if (!catalog.some(section => section.id === id)) return;
      current = id;
      clearSearch();
      window.scrollTo({top:0,behavior:'instant'});
    }
    search.addEventListener('input', renderSearch);
    clearButton.addEventListener('click', () => { clearSearch(); search.focus(); });
    select.addEventListener('change', () => { if (location.hash === `#section-${select.value}`) navigate(select.value); else location.hash = `section-${select.value}`; });
    window.addEventListener('hashchange', () => { if (location.hash.startsWith('#section-')) navigate(location.hash.slice(9)); });
    document.addEventListener('click', event => {
      const reset = event.target.closest('[data-clear]');
      if (reset) { event.preventDefault(); clearSearch(); search.focus(); }
      const link = event.target.closest('a[href^="#section-"]');
      if (link && link.hash === location.hash) { event.preventDefault(); navigate(link.hash.slice(9)); }
    });
    document.addEventListener('keydown', event => {
      if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { event.preventDefault(); search.focus(); }
      if (event.key === 'Escape' && document.activeElement === search) clearSearch();
    });
    renderSearch();
  </script>
